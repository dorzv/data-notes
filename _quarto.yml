project:
  type: website

editor:
  render-on-save: true

website:
  title: "Data Notes"
  description: "Practical writing about computer vision, deep learning and data science."
  site-url: https://dorzv.github.io/data-notes/
  favicon: "images/favicon.png"
  open-graph: true
  twitter-card: true

  navbar:
    background: "#244f68"
    foreground: "#ffffff"
    pinned: true
    collapse: true

    left:
      - text: "Latest"
        href: index.qmd#latest
      - text: "Editor's Picks"
        href: editors-picks.qmd
      - text: "About"
        href: about.qmd

    right:
      - icon: github
        href: https://github.com/dorzv/ComputerVision/
        aria-label: GitHub

    search: true

  page-footer:
    left: "© 2026 Data Notes"
    right:
      - text: "About"
        href: about.qmd
      - text: "GitHub"
        href: https://github.com/dorzv/ComputerVision/

format:
  html:
    theme: flatly
    css: styles.css
    page-layout: article
    toc: false
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    canonical-url: true
    include-after-body: _cloudflare.html
    include-in-header:
      - text: |
          <meta name="google-site-verification" content="jf7LNHuaUy48DsohM2yW3gcgo8JLr5KKaE69EGvLqYA" />